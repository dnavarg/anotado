<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Anotado">
  <meta name="description" content="Anotado: Notas rápidas, recordatorios y lista de supermercado con calculadora en vivo.">
  <title>Anotado</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="apple-touch-icon" href="./assets/icon.svg">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Tablet / Desktop Master Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Navegación principal"></aside>

    <!-- Main Workspace -->
    <div class="main-area">
      <header id="topbar" class="topbar"></header>
      <main id="content" class="content" tabindex="-1"></main>
      <div id="sticky-bar" class="sticky-bar hidden"></div>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-root" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>

  <!-- Toast Container -->
  <div id="toast-root" class="toast-container" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
